[package]
name = "tok"
version = "0.1.0"
edition = "2024"
description = "Count tokens in text, per-model — 35 tokenizer families, calibrated estimates for closed ones, reverse mode, and billing math"
license = "MPL-2.0"
readme = "README.md"
keywords = ["tokenizer", "tokens", "bpe", "llm", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
tiktoken-rs = "0.6"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
